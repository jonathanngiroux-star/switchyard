name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # W5–7: migration fidelity gates. The representative corpus must stay
      # at 100% (parser regressions fail CI); the edge corpus must report
      # every unmappable construct type (honesty contract).
      - name: build
        run: go build -o switchyard ./cmd/switchyard
      - name: fidelity gate (representative corpus, >=90% required)
        run: |
          ./switchyard migrate --from=launchdarkly --dry-run \
            --input testdata/fixtures/launchdarkly/full-export.json \
            --fidelity docs/fidelity/launchdarkly.md
      - name: fidelity report is committed and current
        run: |
          ./switchyard migrate --from=launchdarkly --dry-run \
            --input testdata/fixtures/launchdarkly/full-export.json \
            --fidelity /tmp/check.md --fidelity-gate 0
          diff docs/fidelity/launchdarkly.md /tmp/check.md \
            && echo "report current" \
            || (echo "::error::docs/fidelity/launchdarkly.md is stale — regenerate with 'switchyard migrate --from=launchdarkly --dry-run --input testdata/fixtures/launchdarkly/full-export.json --fidelity docs/fidelity/launchdarkly.md'" && exit 1)
      - name: edge corpus honesty check (all gap types reported)
        run: |
          ./switchyard migrate --from=launchdarkly --dry-run \
            --input testdata/fixtures/launchdarkly/edge-cases.json \
            --format=json --fidelity-gate 0 | \
            jq -e '.fidelity.by_type | has("weighted-rollout") and has("clause-operator") and has("bucketBy") and has("segment-unbounded")' \
            || (echo "::error::edge corpus gap reporting regressed" && exit 1)
      # W8: Unleash migrator gates — same contract as LaunchDarkly.
      - name: unleash fidelity gate (representative corpus, >=90% required)
        run: |
          ./switchyard migrate --from=unleash --dry-run \
            --input testdata/fixtures/unleash/unleash-representative.json \
            --fidelity docs/fidelity/unleash.md
      - name: unleash fidelity report is committed and current
        run: |
          ./switchyard migrate --from=unleash --dry-run \
            --input testdata/fixtures/unleash/unleash-representative.json \
            --fidelity /tmp/ul-check.md --fidelity-gate 0
          diff docs/fidelity/unleash.md /tmp/ul-check.md \
            && echo "unleash report current" \
            || (echo "::error::docs/fidelity/unleash.md is stale — regenerate with 'switchyard migrate --from=unleash --dry-run --input testdata/fixtures/unleash/unleash-representative.json --fidelity docs/fidelity/unleash.md'" && exit 1)
      - name: unleash edge corpus honesty check (all gap types reported)
        run: |
          ./switchyard migrate --from=unleash --dry-run \
            --input testdata/fixtures/unleash/unleash-edge.json \
            --format=json --fidelity-gate 0 | \
            jq -e '.fidelity.by_type | has("strategy-random-rollout") and has("strategy-unsupported") and has("constraint-operator") and has("stickiness") and has("bucketBy") and has("weighted-variants") and has("segment-missing")' \
            || (echo "::error::unleash edge corpus gap reporting regressed" && exit 1)
      # W9: generated SDKs must stay byte-conformant with the Go evaluator.
      # ubuntu-latest runners ship node + python3, so this runs for real in CI.
      - name: cross-language SDK conformance (Go == TypeScript == Python)
        run: go test ./cmd/switchyard/ -run TestCrossLanguageConformance -v -timeout 5m
      # Desktop GUI: the fyne-tagged source must compile (cgo + GL on the
      # runner). The default cgo-free build is covered by the steps above.
      - name: install desktop build deps (X11/GL/Wayland dev headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: desktop build compiles (fyne tag)
        run: CGO_ENABLED=1 go build -tags fyne -o /tmp/switchyard-desktop ./cmd/switchyard
